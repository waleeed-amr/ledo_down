<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledo Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-view" class="container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <div class="card" style="width: 100%; max-width: 420px; margin: 0 auto;">
            <h2>Admin Login</h2>
            <form id="login-form">
                <div class="input-group">
                    <input type="email" id="admin-email" placeholder="Email Address" autocomplete="off" required>
                </div>
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="Password" autocomplete="off" required>
                </div>
                <button type="submit" id="btn-login" class="btn">Login to Dashboard</button>
            </form>
            <div id="login-error"></div>
        </div>
    </div>

    <div id="dashboard-view" class="container" style="display: none;">
        <header>
            <h2>Ledo Telemetry</h2>
            <button id="btn-logout" class="btn btn-outline">Logout</button>
        </header>

        <div class="card">
            <h3 style="margin-top: 0; margin-bottom: 20px; font-weight: 500;">Recent Crash Reports</h3>
            <div class="table-responsive">
                <table id="crash-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Category</th>
                            <th>Domain</th>
                            <th>Message</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="crash-tbody">
                        <tr><td colspan="5" style="text-align: center; padding: 30px;">Loading reports...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
